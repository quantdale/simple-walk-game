name: ci

on:
  push:
    branches: ["main", "agent/simple-walk-game/**"]
  pull_request:
    branches: ["main"]

jobs:
  identity-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository identity guard (GITHUB_REPOSITORY must equal the declared slug)
        run: scripts/assert-repo-identity.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (clean, warnings visible)
        run: dotnet build SimpleWalkGame.sln

      - name: Test
        run: dotnet test SimpleWalkGame.sln --no-build

      - name: Architecture fitness checks (dependency direction, engine-free domain)
        run: scripts/verify-architecture.sh

      - name: Build smoke (Release publish produces a runnable artifact)
        run: |
          dotnet publish tools/simulation -c Release -o "$RUNNER_TEMP/simcli"
          test -x "$RUNNER_TEMP/simcli/WalkGame.SimCli"

      - name: Simulation smoke (deterministic loop + tamper selftest)
        run: |
          SAVES=$(mktemp -d)
          dotnet run --project tools/simulation --no-build -- new --save "$SAVES" --seed 7 --at 2026-08-20T08:00:00Z
          dotnet run --project tools/simulation --no-build -- simulate --save "$SAVES" --days 5 --start 2026-08-20T08:00:00Z > /dev/null
          dotnet run --project tools/simulation --no-build -- validate --save "$SAVES" --selftest
          rm -rf "$SAVES"

      - name: Exactly-once acceptance (walk, then replay must credit zero)
        run: |
          SAVES=$(mktemp -d)
          dotnet run --project tools/simulation --no-build -- walk --save "$SAVES" --days 16 \
            --steps-per-day 20000 --at 2026-08-20T08:00:00Z
          # The replayed window must be recognised as 16 duplicates and credit nothing.
          dotnet run --project tools/simulation --no-build -- walk --save "$SAVES" --days 16 \
            --steps-per-day 20000 --at 2026-08-20T08:00:00Z --replay \
            | tee "$RUNNER_TEMP/replay.txt"
          grep -q "vitality credited: 0" "$RUNNER_TEMP/replay.txt"
          grep -q "duplicate records ignored: 16" "$RUNNER_TEMP/replay.txt"
          rm -rf "$SAVES"

      - name: Long-horizon offline simulation (365 app-closed days)
        run: |
          SAVES=$(mktemp -d)
          dotnet run --project tools/simulation --no-build -- longhaul --save "$SAVES" --days 365 \
            --seed 7 --at 2026-08-20T08:00:00Z
          rm -rf "$SAVES"

      - name: Hook installer is idempotent
        run: |
          scripts/install-git-hooks.sh
          test "$(git config core.hooksPath)" = ".githooks"
          scripts/install-git-hooks.sh

      - name: Guard proof suite (identity / lease / pre-push race)
        run: tests/guards/run-guard-tests.sh

      - name: Pacing evidence reproducibility (all seven GAME_SYSTEMS 13 profiles)
        run: scripts/verify-pacing-evidence.sh

      - name: Save-growth / performance-scenario determinism (PERFORMANCE_BUDGETS 15)
        run: scripts/verify-save-growth.sh
