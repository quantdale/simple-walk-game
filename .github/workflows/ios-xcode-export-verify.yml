name: ios-xcode-export-verify

# MANUAL-ONLY since D-116. Unsigned xcodebuild of a Unity iOS Xcode export (KI-022).
# The export contains Unity's proprietary engine library (libiPhone-lib.a) and other Unity
# binaries, which must NEVER be pushed to this public repository. The old public transport
# (tools/unity/push-ios-export.sh -> ios-export/** branches) is retired and the push trigger is
# removed. Running this again REQUIRES A PRIVATE TRANSPORT (e.g. a private repository or private
# storage) that places the export at $RUNNER_TEMP/x/xcode; none is configured, so the
# "Obtain export" step fails closed. The workflow also refuses any ref that carries an ios-export/
# payload. Evidence from run 38920379246 (D-115) remains valid.
# No Unity, licence or secrets on CI; no signing (CODE_SIGNING_ALLOWED=NO); no artifacts.
# Label: "Xcode-built unsigned on hosted macOS, not device-tested".

on:
  workflow_dispatch:

jobs:
  xcodebuild-unsigned:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository identity guard
        run: scripts/assert-repo-identity.sh

      - name: Refuse public engine payloads (D-116)
        run: scripts/verify-no-engine-binaries.sh

      - name: Obtain export (private transport required, D-116)
        run: |
          echo "No private transport is configured. Unity engine binaries must never be pushed"
          echo "to this public repository (D-116). Add a private transport that extracts the"
          echo "export to \$RUNNER_TEMP/x/xcode before re-enabling this step."
          exit 1

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: xcodebuild (generic iOS device, unsigned)
        working-directory: ${{ runner.temp }}/x/xcode
        run: |
          set -o pipefail
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*HealthKit|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: Check linked HealthKit bridge symbols
        run: |
          fw=$(find "$RUNNER_TEMP/dd" -path "*Release-iphoneos/UnityFramework.framework/UnityFramework" | head -1)
          app=$(find "$RUNNER_TEMP/dd" -path "*Release-iphoneos/*.app" -maxdepth 6 -type d | head -1)
          echo "framework: $fw"; echo "app: $app"
          nm -gU "$fw" > "$RUNNER_TEMP/syms.txt"
          for s in wg_hk_availability wg_hk_request_status wg_hk_request_authorization wg_hk_read_steps; do
            grep -q "_$s\$" "$RUNNER_TEMP/syms.txt" || { echo "missing $s"; exit 1; }
            echo "linked: $s"
          done
          otool -L "$fw" | grep -i healthkit
          echo "XCODE-BUILT UNSIGNED ON HOSTED macOS, NOT DEVICE-TESTED"
