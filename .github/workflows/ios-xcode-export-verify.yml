name: ios-xcode-export-verify

# Unsigned xcodebuild of a Unity iOS Xcode export (KI-022). The export is produced on the
# Linux box by tools/unity/export-ios-xcode.sh (free iOS Build Support module) and pushed as
# split xz chunks on a throwaway `ios-export/**` branch (never main). No Unity, no Unity
# licence and no secrets on CI; no signing (CODE_SIGNING_ALLOWED=NO); no artifacts uploaded.
# Free: public repository + standard macos-latest runner (GitHub Actions billing docs:
# "free for public repositories that use standard GitHub-hosted runners").
# Label: "Xcode-built unsigned on hosted macOS, not device-tested".

on:
  push:
    branches: ["ios-export/**"]
  workflow_dispatch:

jobs:
  xcodebuild-unsigned:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository identity guard
        run: scripts/assert-repo-identity.sh

      - name: Reassemble export
        run: |
          test -d ios-export || { echo "no ios-export/ payload on this ref"; exit 1; }
          cat ios-export/MANIFEST.txt
          (cd ios-export && shasum -a 256 -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/x"
          cat ios-export/xcode.tar.xz.part-* | xz -d | tar -x -C "$RUNNER_TEMP/x"
          du -sh "$RUNNER_TEMP/x/xcode"

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: xcodebuild (generic iOS device, unsigned)
        working-directory: ${{ runner.temp }}/x/xcode
        run: |
          set -o pipefail
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*HealthKit|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: Check linked HealthKit bridge symbols
        run: |
          fw=$(find "$RUNNER_TEMP/dd" -path "*Release-iphoneos/UnityFramework.framework/UnityFramework" | head -1)
          app=$(find "$RUNNER_TEMP/dd" -path "*Release-iphoneos/*.app" -maxdepth 6 -type d | head -1)
          echo "framework: $fw"; echo "app: $app"
          nm -gU "$fw" > "$RUNNER_TEMP/syms.txt"
          for s in wg_hk_availability wg_hk_request_status wg_hk_request_authorization wg_hk_read_steps; do
            grep -q "_$s\$" "$RUNNER_TEMP/syms.txt" || { echo "missing $s"; exit 1; }
            echo "linked: $s"
          done
          otool -L "$fw" | grep -i healthkit
          echo "XCODE-BUILT UNSIGNED ON HOSTED macOS, NOT DEVICE-TESTED"
