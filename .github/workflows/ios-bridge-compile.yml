name: ios-bridge-compile

# Compile-only check of the Swift HealthKit bridge (KI-022, D-114) on a GitHub-hosted
# macOS runner. Free: the repository is public and macos-latest is a standard runner
# (GitHub Actions billing docs: "free for public repositories that use standard
# GitHub-hosted runners"; larger runners are NOT used). No Unity, no signing, no device,
# no artifacts uploaded. Label: "compiled on hosted macOS", never "device-tested".

on:
  push:
    branches: ["main", "agent/simple-walk-game/**"]
    paths:
      - "src/WalkGame.Unity/Assets/Plugins/iOS/**"
      - ".github/workflows/ios-bridge-compile.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/WalkGame.Unity/Assets/Plugins/iOS/**"
      - ".github/workflows/ios-bridge-compile.yml"
  workflow_dispatch:

jobs:
  swift-healthkit-bridge:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository identity guard
        run: scripts/assert-repo-identity.sh

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos swiftc --version

      - name: Type-check bridge against the iOS SDK (arm64 device)
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios15.0 \
            src/WalkGame.Unity/Assets/Plugins/iOS/*.swift

      # -wmo: one object file for every bridge file (D-186 added WalkGameAccessibilityBridge.swift).
      - name: Compile bridge to an object file (no link, no signing)
        run: |
          xcrun --sdk iphoneos swiftc -c -parse-as-library -O -wmo \
            -target arm64-apple-ios15.0 -module-name WalkGameHealthKitBridge \
            -o "$RUNNER_TEMP/bridge.o" \
            src/WalkGame.Unity/Assets/Plugins/iOS/*.swift
          nm -gU "$RUNNER_TEMP/bridge.o" | tee "$RUNNER_TEMP/symbols.txt"
          for s in wg_hk_availability wg_hk_request_status wg_hk_request_authorization wg_hk_read_steps wg_reduce_motion_enabled; do
            grep -q "_$s\$" "$RUNNER_TEMP/symbols.txt" || { echo "missing C symbol $s"; exit 1; }
          done
          echo "COMPILED ON HOSTED macOS (not device-tested)"
