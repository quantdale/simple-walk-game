# Dependabot: an automated update path for the four test-side third-party packages.
#
# The runtime surface is deliberately one first-party package and is enforced as a
# property by scripts/verify-dependency-health.sh. The TEST-side packages have no
# such constraint and previously had no update path at all, which is how a
# repository ends up discovering an advisory by reading about it.
#
# Grouping keeps the diff reviewable: one grouped pull request per ecosystem
# instead of four unrelated ones, and no auto-merge anywhere.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # System.Text.Json is the one shipped runtime package, published into the Unity
    # netstandard2.1 plugin folder; a major bump needs its own decision and Unity/APK
    # evidence (D-064, KI-024), so Dependabot only proposes patch/minor updates for it.
    ignore:
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
    groups:
      xunit:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
